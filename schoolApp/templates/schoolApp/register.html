{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Register - EduForAll</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <link href="{% static 'img/favicon.svg' %}" rel="icon" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body class="auth-page">
    <div class="auth-shell">
        <a href="{% url 'school' %}" class="auth-back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

        <div class="auth-card auth-card--wide">
            <div class="auth-header">
                <div class="auth-badge">Join Our Community</div>
                <h2>Create Account</h2>
                <p>Start your learning journey with EduForAll</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <div class="auth-role-selector">
                <a href="{% url 'register' %}?role=student"
                    class="auth-role-btn {% if role == 'student' %}active{% endif %}">
                    <i class="fas fa-user-graduate"></i> Student
                </a>
                <a href="{% url 'register' %}?role=mentor"
                    class="auth-role-btn {% if role == 'mentor' %}active{% endif %}">
                    <i class="fas fa-chalkboard-teacher"></i> Mentor
                </a>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="role" value="{{ role }}">

                <div class="auth-form-row">
                    <div class="auth-form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" class="auth-input" required
                            placeholder="Enter first name">
                    </div>
                    <div class="auth-form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" class="auth-input" required
                            placeholder="Enter last name">
                    </div>
                </div>

                <div class="auth-form-row">
                    <div class="auth-form-group">
                        <label for="phone_number">Phone Number</label>
                        <input type="tel" id="phone_number" name="phone_number" class="auth-input" required
                            placeholder="Enter phone number">
                    </div>
                    <div class="auth-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="auth-input" required
                            placeholder="Enter email address">
                    </div>
                </div>

                <div class="auth-form-row">
                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="auth-input" required
                            placeholder="Create a password">
                    </div>
                    <div class="auth-form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="auth-input" required
                            placeholder="Confirm your password">
                    </div>
                </div>

                <div class="auth-form-group" id="mentorExpertise" style="display: none;">
                    <label for="expertise">Area of Expertise</label>
                    <input type="text" id="expertise" name="expertise" class="auth-input"
                        placeholder="e.g. Web Development, Marketing, Design">
                </div>

                <button type="submit" class="btn btn-auth">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="{% url 'login' %}?role={{ role }}">Log in</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const roleHidden = '{{ role|default:"student" }}';
        const mentorField = document.getElementById('mentorExpertise');

        function updateMentorField() {
            const currentRole = new URLSearchParams(window.location.search).get('role') || roleHidden || 'student';
            if (currentRole === 'mentor') {
                mentorField.style.display = 'block';
            } else {
                mentorField.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', updateMentorField);
        window.addEventListener('popstate', updateMentorField);
    </script>
</body>

</html>
