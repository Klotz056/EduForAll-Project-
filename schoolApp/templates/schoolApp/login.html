{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login - EduForAll</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="{% static 'img/favicon.svg' %}" rel="icon" type="image/svg+xml">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

</head>

<body class="auth-page">
    <div class="auth-shell">
        <a href="{% url 'school' %}" class="auth-back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge">Students & Mentors</div>
                <h2>Welcome Back</h2>
                <p>Login to your EduForAll account</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <div class="auth-role-selector">
                <a href="{% url 'login' %}?role=student"
                    class="auth-role-btn {% if role == 'student' %}active{% endif %}">
                    <i class="fas fa-user-graduate"></i> Student
                </a>
                <a href="{% url 'login' %}?role=mentor"
                    class="auth-role-btn {% if role == 'mentor' %}active{% endif %}">
                    <i class="fas fa-chalkboard-teacher"></i> Mentor
                </a>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="role" value="{{ role }}">

                <div class="auth-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="auth-input" required
                        placeholder="Enter your email">
                </div>

                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="auth-input" required
                        placeholder="Enter your password">
                </div>

                <div class="auth-checkbox-row">
                    <input type="checkbox" id="remember_me" name="remember_me" value="on">
                    <label for="remember_me">Remember me for 4 weeks</label>
                </div>

                <button type="submit" class="btn btn-auth">Login</button>
            </form>

            <div class="auth-footer">
                Don’t have an account?
                <a href="{% url 'register' %}?role={{ role }}">Register here</a>
            </div>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
